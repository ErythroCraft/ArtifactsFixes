repositories {
    mavenCentral()
    maven {
        name 'Modrinth'
        url 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth' // Curious Armor Stands, Trinkets Canary
        }
    }
    maven {
        name 'C4'
        url 'https://maven.theillusivec4.top/'
        content {
            includeGroupAndSubgroups 'top.theillusivec4' // Curios
        }
    }
    maven {
        name 'Florens'
        url 'https://maven.florens.be/releases'
        content {
            includeGroup 'be.florens' // ExpandAbility
        }
    }
    maven {
        name 'shedaniel'
        url 'https://maven.shedaniel.me/'
        content {
            includeGroupAndSubgroups 'me.shedaniel' // Cloth Config
        }
    }
    maven {
        name 'TerraformersMC'
        url 'https://maven.terraformersmc.com/'
        content {
            includeGroup 'com.terraformersmc' // Mod Menu
        }
    }
    maven {
        name 'Ladysnake Mods'
        url 'https://maven.ladysnake.org/releases'
        content {
            includeGroupAndSubgroups 'org.ladysnake' // Cardinal Components
            includeGroupAndSubgroups 'io.github' // PlayerAbilityLib (Apoli)
        }
    }
    maven {
        name 'Ladysnake Mods (snapshots)'
        url 'https://maven.ladysnake.org/snapshots'
        content {
            includeGroupAndSubgroups 'io.github' // Apoli
        }
    }
    maven {
        name 'BlameJared'
        url 'https://maven.blamejared.com'
        content {
            includeGroup 'noobanidus.mods.lootr' // Lootr
        }
    }
    maven {
        name 'QuiltMC'
        url 'https://maven.quiltmc.org/repository/release'
        content {
            includeGroupAndSubgroups 'org.quiltmc' // Gson (Apoli)
        }
    }
    maven {
        name 'NeoForged'
        url 'https://maven.neoforged.net/releases/'
        content {
            includeGroupAndSubgroups 'net.neoforged' // NeoForge
            includeGroup 'cpw.mods' // FML
        }
    }
    maven {
        name 'Wisp Forest'
        url 'https://maven.wispforest.io/releases'
        content {
            includeGroupAndSubgroups 'io.wispforest' // Accessories, Endec (Accessories)
        }
    }

    maven {
        name 'Su5eD'
        url 'https://maven.su5ed.dev/releases'
        content {
            includeGroupAndSubgroups 'org.sinytra' // Forgified Fabric API (Accessories)
        }
    }
}
