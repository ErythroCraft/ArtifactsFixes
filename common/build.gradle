architectury {
    common(rootProject.enabled_platforms.split(","))
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"

    modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude(group: 'net.fabricmc.fabric-api')
    }

    modCompileOnly "be.florens:expandability-fabric:${project.expandability_version}"

    compileOnly "com.electronwill.night-config:toml:${project.night_config_version}"

    modCompileOnly("io.wispforest:accessories-common:${project.accessories_version}"){
        exclude(group: 'net.fabricmc.fabric-api')
    }

    modCompileOnly("maven.modrinth:trinkets-canary:${project.trinkets_version}"){
        exclude(group: 'net.fabricmc.fabric-api')
    }
    modCompileOnly("org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cardinal_components_version}")

    modCompileOnly "noobanidus.mods.lootr:lootr-common:${project.lootr_version}"
    modCompileOnly "maven.modrinth:origins:5o5sFcLS"
    modCompileOnly("io.github.apace100:apoli:2.12.0-alpha.15+mc.1.21.1")
}
