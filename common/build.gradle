plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
}

dependencies {
    // mixin
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.5.3'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.5.3'

    // required dependencies
    compileOnly "be.florens:expandability-fabric:${project.expandability_version}"
    compileOnly "com.electronwill.night-config:toml:${project.night_config_version}"

    // optional dependencies
    compileOnly("io.wispforest:accessories-common:${project.accessories_version}") {
        exclude(group: 'net.fabricmc.fabric-api')
    }

    compileOnly("eu.pb4:trinkets:${project.trinkets_version}") {
        exclude(group: 'net.fabricmc.fabric-api')
    }

    compileOnly("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude(group: 'net.fabricmc.fabric-api')
    }

    // compat & integration
    compileOnly "maven.modrinth:lootr:s0EnSZFB"
    compileOnly "maven.modrinth:origins:5o5sFcLS"
    compileOnly "io.github.apace100:apoli:2.12.0-alpha.15+mc.1.21.1"
}
