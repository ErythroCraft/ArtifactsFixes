plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle(project(path: ':common', configuration: 'transformProductionFabric'))

    include("com.electronwill.night-config:core:${project.night_config_version}")
    include(implementation("com.electronwill.night-config:toml:${project.night_config_version}"))

    modImplementation "eu.pb4.fork:trinkets:${project.trinkets_version}"

    modImplementation("com.terraformersmc:modmenu:${project.mod_menu_version}") {
        transitive = false
    }

    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

    modImplementation include("org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cardinal_components_version}")
    modImplementation include("org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cardinal_components_version}")

    modCompileOnly include("be.florens:expandability-fabric:${project.expandability_version}")

    // Compat & integration
    modCompileOnly("io.wispforest:accessories-fabric:${project.accessories_version}")
    modCompileOnly("io.wispforest:owo-lib:${project.owo_version}")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
