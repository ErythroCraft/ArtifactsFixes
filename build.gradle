plugins {
    id 'dev.architectury.loom' version '1.11-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'

    base {
        archivesName = "$rootProject.archives_name-$project.name"
    }

    sourceSets {
        main.resources.srcDirs = ['src/main/resources', 'src/generated/resources']
    }

    // TODO remove unused repositories
    repositories {
        mavenCentral()
        maven {
            url "https://jitpack.io"
            content {
                includeGroupByRegex "com.github.*"
            }
        }
        maven {
            url "https://cursemaven.com"
            content {
                includeGroup "curse.maven"
            }
        }
        maven {
            url "https://api.modrinth.com/maven"
            content {
                includeGroup "maven.modrinth" // Curious Armor Stands
            }
        }
        maven {
            url "https://maven.theillusivec4.top/"
            content {
                includeGroupByRegex "top.theillusivec4.*" // Curios
            }
        }
        maven {
            url "https://maven.florens.be/releases"
            content {
                includeGroup "be.florens" // ExpandAbility
            }
        }
        maven {
            url "https://maven.shedaniel.me/"
            content {
                includeGroupByRegex "me.shedaniel.*" // Cloth Config
            }
        }
        maven {
            url "https://maven.terraformersmc.com/"
            content {
                includeGroup "dev.emi" // Trinkets
                includeGroup "com.terraformersmc" // Mod Menu
            }
        }
        maven {
            name "Ladysnake Mods"
            url "https://maven.ladysnake.org/releases"
            content {
                includeGroupByRegex "dev.onyxstudios.*"
                includeGroupByRegex "org.ladysnake.*" // Cardinal Components
                includeGroupByRegex "io.github.*"
            }
        }
        maven {
            name 'Ladysnake Mods (snapshots)'
            url 'https://maven.ladysnake.org/snapshots'
            content {
                includeGroupByRegex "io.github.*" // Apoli?
            }
        }
        maven { // Lootr
            url 'https://maven.blamejared.com'
            content {
                includeGroup 'noobanidus.mods.lootr'
            }
        }
        maven {
            name "QuiltMC"
            url "https://maven.quiltmc.org/repository/release"
            content {
                includeGroupByRegex "org.quiltmc.*"
            }
        }
        maven {
            name "NeoForge"
            url "https://maven.neoforged.net/releases/"
            content {
                includeGroupByRegex "net.neoforged.*"
                includeGroup "cpw.mods"
            }
        }
        maven { // Accessories
            name "Wisp Forest"
            url 'https://maven.wispforest.io/releases'
        }
        maven {
            url 'https://maven.su5ed.dev/releases'
        }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }
}
