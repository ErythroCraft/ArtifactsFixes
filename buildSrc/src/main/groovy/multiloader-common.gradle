plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name 'Sponge'
        url 'https://repo.spongepowered.org/repository/maven-public'
        content {
            includeGroupAndSubgroups 'org.spongepowered' // Mixin
        }
    }
    maven {
        name 'Modrinth'
        url 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth' // Curious Armor Stands
        }
    }
    maven {
        name 'C4'
        url 'https://maven.theillusivec4.top/'
        content {
            includeGroupAndSubgroups 'top.theillusivec4' // Curios
        }
    }
    maven {
        name 'Nucleoid'
        url 'https://maven.nucleoid.xyz/releases'
        content {
            includeGroupAndSubgroups 'eu.pb4' // Trinkets
        }
    }
    maven {
        name 'Florens'
        url 'https://maven.florens.be/releases'
        content {
            includeGroup 'be.florens' // ExpandAbility
        }
    }
    maven {
        name 'shedaniel'
        url 'https://maven.shedaniel.me/'
        content {
            includeGroupAndSubgroups 'me.shedaniel' // Cloth Config
        }
    }
    maven {
        name 'TerraformersMC'
        url 'https://maven.terraformersmc.com/'
        content {
            includeGroup 'com.terraformersmc' // Mod Menu
        }
    }
    maven {
        name 'Ladysnake Mods'
        url 'https://maven.ladysnake.org/releases'
        content {
            includeGroupAndSubgroups 'org.ladysnake' // Cardinal Components
            includeGroupAndSubgroups 'io.github' // PlayerAbilityLib (Apoli)
        }
    }
    maven {
        name 'Ladysnake Mods (snapshots)'
        url 'https://maven.ladysnake.org/snapshots'
        content {
            includeGroupAndSubgroups 'io.github' // Apoli
        }
    }
    maven {
        name 'FabricMC'
        url 'https://maven.fabricmc.net/'
        content {
            includeGroupAndSubgroups 'net.fabricmc' // Fabric Loader, Fabric API
        }
    }
    maven {
        name 'QuiltMC'
        url 'https://maven.quiltmc.org/repository/release'
        content {
            includeGroupAndSubgroups 'org.quiltmc' // Gson (Apoli)
        }
    }
    maven {
        name 'NeoForged'
        url 'https://maven.neoforged.net/releases/'
        content {
            includeGroupAndSubgroups 'net.neoforged' // NeoForge
            includeGroup 'cpw.mods' // FML
        }
    }
    maven {
        name 'Wisp Forest'
        url 'https://maven.wispforest.io/releases'
        content {
            includeGroupAndSubgroups 'io.wispforest' // Accessories, Endec (Accessories)
        }
    }
    maven {
        name 'Su5eD'
        url 'https://maven.su5ed.dev/releases'
        content {
            includeGroupAndSubgroups 'org.sinytra' // Forgified Fabric API (Accessories)
        }
    }
}

sourcesJar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                           : version,
            'group'                             : project.group, // Else we target the task's group.
            'minecraft_version'                 : minecraft_version,
            'minecraft_version_range_neoforge'  : minecraft_version_range_neoforge,
            'minecraft_version_range_fabric'    : minecraft_version_range_fabric,
            'fabric_version'                    : fabric_version,
            'fabric_loader_version'             : fabric_loader_version,
            'mod_name'                          : mod_name,
            'mod_author'                        : mod_author,
            'mod_id'                            : mod_id,
            'license'                           : license,
            'description'                       : project.description,
            'homepage'                          : homepage,
            'issue_tracker'                     : issue_tracker,
            'sources'                           : sources,
            'neoforge_version'                  : neoforge_version,
            'neoforge_version_range'            : neoforge_version_range,
            'java_version'                      : java_version
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace("\n", "\\\\n") : value]
    }

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url System.getenv('local_maven_url')
        }
    }
}
